<html xmlns:f="https://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:be.container pageTitle="{f:translate(key: 'pagetitle')}" includeRequireJsModules="{0:'TYPO3/CMS/NsBasetheme/Main'}">

    <!-- Due to css-order rendering issue ignoring "includeCssFiles" -->
    <link rel="stylesheet" type="text/css" href="/typo3conf/ext/ns_basetheme/Resources/Public/Vendor/bootstrap4.3.1.min.css" media="all">
    <link rel="stylesheet" type="text/css" href="/typo3conf/ext/ns_basetheme/Resources/Public/css/Module/global.css" media="all">
    <link rel="stylesheet" type="text/css" href="/typo3conf/ext/ns_basetheme/Resources/Public/css/Module/main.css" media="all">

	<div class="typo3-fullDoc">
		<div id="typo3-docheader">
			<div class="typo3-docheader-functions">
				<f:be.buttons.csh />
				<div class="ns-ext-button-bar">
					<!-- <a class="btn btn-primary btn-backup-wizard-modal text-white" href="javascript:;" type="button">
						<em class="fa fa-cogs" aria-hidden="true"></em><f:translate key="globalsettings" />
					</a> -->
					<div class="button-group float-sm-right">
						<a target="_blank" href="https://docs.t3terminal.com/en/latest/ExtThemes/Index.html" class="btn btn-success text-white btn-sm"><em class="fa fa-file-o"
								aria-hidden="true"></em><f:translate key="documentaiton" /></a>
						<a target="_blank" href="https://t3terminal.com/support-submit-ticket" class="btn btn-info text-white btn-sm"><em class="fa fa-question"
								aria-hidden="true"></em><f:translate key="helpsupport" /></a>
						<a target="_blank" href="https://www.patreon.com/NITSAN_Tech" class="btn btn-secondary text-white btn-sm"><em class="fa fa-dollar"
                                aria-hidden="true"></em><f:translate key="donate" /></a>
                        <a target="_blank" href="https://t3terminal.com/customer/account/" class="btn btn-warning text-white btn-sm"><em class="fa fa-dollar"
                            aria-hidden="true"></em><f:translate key="loginT3Terminal" /></a>
					</div>
				</div>
			</div>
		</div>
		<div id="typo3-docbody">
			<div id="typo3-inner-docbody">
				<div class="ns-ext-navigation">
					<nav class="navbar navbar-expand-lg">
						<a class="navbar-brand" href="javascript:;"><f:translate key="extensionName" /></a>
						<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nsextNavbar"
							aria-controls="nsextNavbar" aria-expanded="false" aria-label="Toggle navigation">
							<span class="navbar-toggler-icon"></span>
						</button>
						<div class="collapse navbar-collapse" id="nsextNavbar">
							<ul class="navbar-nav">
								<!-- <li class="nav-item {f:if(condition: '{action}==dashboard', then: 'active')}">
									<f:link.action action="dashboard" class="nav-link">
										<em class="fa fa-dashboard" aria-hidden="true"></em><f:translate key="Dashboard" /></f:link.action>
								</li> -->
								<li class="nav-item {f:if(condition: '{action}==generalSettings', then: 'active')}">
									<f:link.action action="generalSettings" additionalParams="{cat:'ns_basetheme'}" class="nav-link">
										<em class="fa fas fa-cog" aria-hidden="true"></em><f:translate key="generalSettings" />
									</f:link.action>
                                </li>
                                <li class="nav-item {f:if(condition: '{action}==seoSettings', then: 'active')}">
									<f:link.action action="seoSettings" additionalParams="{cat:'ns_seo'}" class="nav-link">
										<em class="fa fas fa-search" aria-hidden="true"></em><f:translate key="seoSettings" />
									</f:link.action>
                                </li>
                                <li class="nav-item {f:if(condition: '{action}==gdprSettings', then: 'active')}">
									<f:link.action action="gdprSettings" additionalParams="{cat:'ns_gdpr'}" class="nav-link">
										<em class="fa fas fa-lock" aria-hidden="true"></em><f:translate key="gdprSettings" />
									</f:link.action>
                                </li>
                                <li class="nav-item {f:if(condition: '{action}==styleSettings', then: 'active')}">
									<f:link.action action="styleSettings" additionalParams="{cat:'ns_style'}" class="nav-link">
										<em class="fa fas fa-adjust" aria-hidden="true"></em><f:translate key="styleSettings" />
									</f:link.action>
                                </li>
                                <li class="nav-item {f:if(condition: '{action}==integrationSettings', then: 'active')}">
									<f:link.action action="integrationSettings" additionalParams="{cat:'ns_integration'}" class="nav-link">
										<em class="fa fas fa-code" aria-hidden="true"></em><f:translate key="integrationSettings" />
									</f:link.action>
								</li>
								<li class="nav-item {f:if(condition: '{action}==aboutExtension', then: 'active')}">
									<f:link.action action="aboutExtension" class="nav-link">
										<em class="fa fa-empire" aria-hidden="true"></em><f:translate key="aboutExtension" />
									</f:link.action>
								</li>
							</ul>
						</div>
					</nav>
				</div>
				<f:render section="content" />
			</div>
		</div>
	</div>
</f:be.container>

</html>
